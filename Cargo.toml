[package]
name = "cabinet"
version = "0.1.0"
authors = ["Ion Skalamera <ion1@skalamera.ch>"]
license = "ISC"
edition = "2024"

description = "Public file hosting / sharing server."
homepage = "https://github.com/Ion-1/cabinet"
repository = "https://github.com/Ion-1/cabinet"

[dependencies]
axum = { version = "0.8.4", features = ["http2", "multipart", "macros"] }
axum-extra = { version = "0.10.1", features = ["typed-header"] }
axum-server = { version = "0.7.2", features = ["tls-rustls"] }
base64 = "0.22.1"
bson = { version = "3.0.0", features = ["jiff-0_2", "serde", "serde_with-3"] }
config = "0.15.16"
form_urlencoded = "1.2.2"
jiff = { version = "0.2.15", features = ["serde"] }
mime = "0.3.17"
rand = "0.9.2"
rcgen = "0.14.5"
sanitise-file-name = "1.0.0"
serde = { version = "1.0.225", features = ["derive"] }
serde_with = "3.14.1"
tokio = { version = "1.47.1", features = ["full"] }
tokio-util = { version = "0.7.16", features = ["io"] }
tower-http = { version = "0.6.6", features = ["limit", "trace", "fs", "request-id", "compression-full"] }
tree_magic_mini = "3.2.0"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "fmt"] }
rustls = "0.23.32"
xxhash-rust = { version = "0.8.15", features = ["std", "xxh3"] }
async-lock = "3.4.1"
